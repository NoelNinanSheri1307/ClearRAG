# ClearRAG — Standard RAG Baseline Configuration

llm:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  device: "auto"        # "auto", "cuda", or "cpu"
  torch_dtype: "float16" # "float16" or "float32"
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false

retrieval:
  top_k: 5
  embedding_model: "BAAI/bge-small-en-v1.5"

prompt:
  system_prompt: "You are a helpful assistant. Answer the question based on the provided context. Be concise, direct, and factual."

paths:
  index_path: "data/processed/faiss_index.bin"
  metadata_path: "data/processed/index_metadata.json"
  benchmark_path: "data/evaluation/clearrag_eval.json"
  results_path: "results/standard_rag_evaluation.json"

evaluation:
  checkpoint_every: 25
  batch_size: 1
