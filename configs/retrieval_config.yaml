# ClearRAG Retrieval Configuration

corpus:
  raw_data_path: "data/raw/hotpotqa/hotpot_dev_distractor_v1.json"
  corpus_output_path: "data/corpus/corpus_chunks.json"
  deduplicate: true
  max_questions: null  # null to process all questions in source data

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  batch_size: 512
  device: "auto"  # "auto", "cuda", or "cpu"
  normalize_embeddings: true
  query_instruction: "Represent this sentence for searching relevant passages: "

indexing:
  index_type: "IndexFlatIP"
  index_output_path: "data/processed/faiss_index.bin"
  metadata_output_path: "data/processed/index_metadata.json"

retrieval:
  default_top_k: 10

evaluation:
  benchmark_path: "data/evaluation/clearrag_eval.json"
  raw_source_path: "data/raw/hotpotqa/hotpot_dev_distractor_v1.json"
  k_values: [1, 3, 5, 10]
  random_seed: 42
  default_eval_subset: 250  # Number of queries for initial benchmark evaluation
